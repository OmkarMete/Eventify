<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saved Plans — Eventify</title>

    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/saved-events.css" />
</head>
<body>

    <!-- ==========================================
         NAVBAR
    =========================================== -->
    <nav class="navbar">
        <div class="nav-container">

            <!-- Logo -->
            <div class="nav-logo">
                <img src="assets/logo.png" alt="Eventify Logo" class="nav-logo-img" />
                <span>Eventify</span>
            </div>

            <!-- Nav Right -->
            <div class="nav-actions">
                <span class="nav-user">
                    <i class="fa-solid fa-circle-user"></i>
                    <span id="navUserName">Loading...</span>
                </span>
                <button class="btn-ghost btn-sm" onclick="history.back()">
                    <i class="fa-solid fa-arrow-left"></i> Back
                </button>
                <a href="/dashboard.html" class="btn-outline">
                    <i class="fa-solid fa-plus"></i> New Plan
                </a>
                <button class="btn-danger" onclick="logout()">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>

        </div>
    </nav>

    <!-- ==========================================
         MAIN CONTENT
    =========================================== -->
    <main class="saved-main">
        <div class="saved-container">

            <!-- Page Header -->
            <div class="saved-header">
                <div class="saved-header-left">
                    <h1 class="saved-title">
                        <i class="fa-solid fa-bookmark gradient-text"></i>
                        Saved Event Plans
                    </h1>
                    <p class="saved-subtitle">All your AI-generated event plans in one place.</p>
                </div>
                <a href="/dashboard.html" class="btn-primary">
                    <i class="fa-solid fa-plus"></i> Create New Plan
                </a>
            </div>

            <!-- Toast -->
            <div class="toast" id="savedToast"></div>

            <!-- ======================================
                 SAVED EVENTS LIST
                 Populated by saved-events.js
            ======================================= -->
            <div id="savedEventsList">

                <!-- Loading State -->
                <div class="saved-loading" id="savedLoading">
                    <div class="loader-spinner" style="width:36px;height:36px;border-width:3px;"></div>
                    <p>Loading your saved plans...</p>
                </div>

            </div>

        </div>
    </main>

    <!-- ==========================================
         EVENT DETAIL MODAL
         Opens when user clicks "View" on a plan
    =========================================== -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal modal-large">

            <!-- Modal Header -->
            <div class="modal-header">
                <h2 class="modal-title" id="detailModalTitle">
                    <i class="fa-solid fa-calendar-star"></i>
                    Event Details
                </h2>
                <button class="modal-close" onclick="closeDetailModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body" id="detailModalBody">
                <!-- Populated by JS -->
            </div>

        </div>
    </div>

    <!-- ==========================================
         EDIT EVENT MODAL
         Opens when user clicks "Edit" on a plan
    =========================================== -->
    <div class="modal-overlay" id="editModal">
        <div class="modal modal-large">

            <!-- Modal Header -->
            <div class="modal-header">
                <h2 class="modal-title">
                    <i class="fa-solid fa-pen-to-square"></i>
                    Edit Event Plan
                </h2>
                <button class="modal-close" onclick="closeEditModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <form class="event-form" id="editEventForm">
                    <input type="hidden" id="editEventId" />

                    <div class="form-row">
                        <div class="form-group">
                            <label for="editEventType"><i class="fa-solid fa-star"></i> Event Type</label>
                            <select id="editEventType">
                                <option value="Wedding">Wedding</option>
                                <option value="Birthday">Birthday</option>
                                <option value="Corporate">Corporate</option>
                                <option value="Engagement">Engagement</option>
                                <option value="Anniversary">Anniversary</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="editCity"><i class="fa-solid fa-location-dot"></i> City</label>
                            <select id="editCity">
                                <option value="Ahmedabad">Ahmedabad</option>
                                <option value="Surat">Surat</option>
                                <option value="Vadodara">Vadodara</option>
                                <option value="Rajkot">Rajkot</option>
                                <option value="Anand">Anand</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="editBudget"><i class="fa-solid fa-indian-rupee-sign"></i> Budget (₹)</label>
                            <input type="number" id="editBudget" min="1" />
                        </div>
                        <div class="form-group">
                            <label for="editGuestCount"><i class="fa-solid fa-users"></i> Number of Guests</label>
                            <input type="number" id="editGuestCount" min="1" />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="editEventDate"><i class="fa-solid fa-calendar"></i> Event Date</label>
                            <input type="date" id="editEventDate" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="editRequirements"><i class="fa-solid fa-clipboard-list"></i> Special Requirements</label>
                        <textarea id="editRequirements" rows="3" placeholder="e.g. Vegetarian food only..."></textarea>
                    </div>

                    <div class="detail-delete-bar">
                        <button type="button" class="btn-outline" onclick="closeEditModal()">
                            Cancel
                        </button>
                        <button type="submit" class="btn-primary">
                            <i class="fa-solid fa-floppy-disk"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <!-- JavaScript -->
    <script src="js/saved-events.js"></script>

</body>
</html>
